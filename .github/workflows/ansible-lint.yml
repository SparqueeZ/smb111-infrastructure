name: ansible-lint

on:
  push:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-lint.yml"
  pull_request:
    paths:
      - "ansible/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: pip install ansible ansible-lint yamllint
      # ansible.cfg référence ./.vault_pass : un mot de passe factice suffit,
      # le lint ne déchiffre pas group_vars/all/vault.yml (exclu).
      - name: Mot de passe de vault factice
        run: echo "ci-factice" > .vault_pass
      - name: yamllint
        run: yamllint .
      - name: Syntaxe des playbooks
        run: ansible-playbook site.yml --syntax-check
      - name: ansible-lint
        run: ansible-lint
