---
common_packages:
  - apt-transport-https
  - bash-completion
  - ca-certificates
  - curl
  - gnupg
  - htop
  - jq
  - rsync
  - tcpdump
  - unzip
  - vim

# Modules et paramètres noyau exigés par kubeadm et le CNI.
common_kernel_modules:
  - overlay
  - br_netfilter
common_sysctl:
  net.ipv4.ip_forward: "1"
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"

# Paquets jamais mis à jour automatiquement (montée de version maîtrisée, lot 9).
common_unattended_blacklist:
  - kubeadm
  - kubelet
  - kubectl
  - kubernetes-cni
  - cri-tools
